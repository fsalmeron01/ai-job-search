# Copy to secret.yaml, fill in real values, and NEVER commit secret.yaml.
# Apply with: kubectl apply -f deploy/k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: ai-job-search-secrets
type: Opaque
stringData:
  # Required: your fork's clone URL. Same formats as deploy/.env.example -
  # an HTTPS token works without any other secret; SSH needs the
  # ssh-privatekey entry below too.
  REPO_URL: "https://github.com/<you>/ai-job-search.git"

  GIT_USER_NAME: ""
  GIT_USER_EMAIL: ""

  # Optional - see deploy/.env.example for the tradeoff vs interactive login.
  ANTHROPIC_API_KEY: ""

  # Optional - only needed for SSH-based private-repo cloning. Paste your
  # deploy key's private key contents here and uncomment the volume/mount
  # in deployment.yaml (search for SSH_PRIVATE_KEY_FILE).
  ssh-privatekey: ""
